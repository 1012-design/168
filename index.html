<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>168 秒｜2026.11.26 14:51 HKT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .pray-icon {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      line-height: 1.2;
      margin-bottom: 18px;
      user-select: none;
    }

    .status-label {
      font-size: clamp(0.9rem, 2.5vw, 1.15rem);
      letter-spacing: 0.16em;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 16px;
      font-weight: 400;
    }

    .main-display {
      font-size: clamp(4.2rem, 19vw, 11rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .unit-label {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      letter-spacing: 0.22em;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 28px;
      min-height: 1.6em;
    }

    .progress-wrap {
      width: min(320px, 72vw);
      height: 2px;
      background-color: rgba(255, 255, 255, 0.2);
      overflow: hidden;
      margin-bottom: 28px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .progress-wrap.visible {
      opacity: 1;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #ffffff;
      transition: width 0.12s linear;
    }

    .blessing-text {
      font-size: clamp(1.6rem, 5.5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #ffffff;
      margin-top: 8px;
      min-height: 1.5em;
    }

    .hkt-clock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .preview-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: transparent;
      color: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 12px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preview-btn:hover, .preview-btn:active {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="pray-icon" aria-label="祈禱">🙏🏻</div>
    <div id="statusLabel" class="status-label">距離 2026年11月26日 14:51 HKT 開始</div>
    <div id="mainDisplay" class="main-display">--:--:--</div>
    <div id="unitLabel" class="unit-label">準備中</div>

    <div id="progressWrap" class="progress-wrap">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="blessingText" class="blessing-text"></div>
  </main>

  <button id="previewBtn" class="preview-btn" type="button">預覽測試</button>
  <div id="hktClock" class="hkt-clock">香港時間：讀取中...</div>

  <script>
    // 嚴格鎖定香港時間 (UTC+8) 2026年11月26日 14:51:00
    const TARGET_START_MS = new Date("2026-11-26T14:51:00+08:00").getTime();
    const DURATION_SEC = 168;

    const statusLabel = document.getElementById("statusLabel");
    const mainDisplay = document.getElementById("mainDisplay");
    const unitLabel = document.getElementById("unitLabel");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");
    const blessingText = document.getElementById("blessingText");
    const hktClock = document.getElementById("hktClock");
    const previewBtn = document.getElementById("previewBtn");

    let isPreviewMode = false;
    let previewStartMs = 0;

    // 防止手機在開啟網頁期間自動熄屏
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          await navigator.wakeLock.request("screen");
        }
      } catch (err) {
        // 忽略不支援或省電模式限制
      }
    }

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function formatHKTClock(nowMs) {
      const hktDate = new Date(nowMs + 8 * 3600 * 1000);
      const y = hktDate.getUTCFullYear();
      const m = pad(hktDate.getUTCMonth() + 1);
      const d = pad(hktDate.getUTCDate());
      const hh = pad(hktDate.getUTCHours());
      const mm = pad(hktDate.getUTCMinutes());
      const ss = pad(hktDate.getUTCSeconds());
      return `香港時間：${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    }

    function formatCountdown(diffMs) {
      const totalSec = Math.max(0, Math.ceil(diffMs / 1000));
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    }

    function update() {
      const nowMs = Date.now();
      hktClock.textContent = formatHKTClock(nowMs);

      const effectiveStartMs = isPreviewMode ? previewStartMs : TARGET_START_MS;
      const elapsedMs = nowMs - effectiveStartMs;

      if (elapsedMs < 0) {
        // 階段一：尚未到達 14:51:00
        statusLabel.textContent = "距離 2026年11月26日 14:51 HKT 開始";
        mainDisplay.textContent = formatCountdown(-elapsedMs);
        unitLabel.textContent = "倒數開始";
        progressWrap.classList.remove("visible");
        progressBar.style.width = "0%";
        blessingText.textContent = "";
      } else if (elapsedMs < DURATION_SEC * 1000) {
        // 階段二：正在數 0 至 168 秒
        const currentSec = Math.floor(elapsedMs / 1000);
        const pct = Math.min(100, (elapsedMs / (DURATION_SEC * 1000)) * 100);

        statusLabel.textContent = isPreviewMode ? "預覽模式進行中" : "2026年11月26日 14:51 HKT";
        mainDisplay.textContent = String(currentSec);
        unitLabel.textContent = `秒 / ${DURATION_SEC} 秒`;
        progressWrap.classList.add("visible");
        progressBar.style.width = `${pct}%`;
        blessingText.textContent = "";
      } else {
        // 階段三：168 秒完成
        statusLabel.textContent = isPreviewMode ? "預覽模式結束" : "2026年11月26日 14:51 HKT";
        mainDisplay.textContent = String(DURATION_SEC);
        unitLabel.textContent = "秒";
        progressWrap.classList.add("visible");
        progressBar.style.width = "100%";
        blessingText.textContent = "祝平安🙏🏻";
      }
    }

    previewBtn.addEventListener("click", () => {
      if (!isPreviewMode) {
        isPreviewMode = true;
        previewStartMs = Date.now();
        previewBtn.textContent = "返回真實時間";
      } else {
        isPreviewMode = false;
        previewBtn.textContent = "預覽測試";
      }
      update();
    });

    // 當從背景或鎖屏切換回頁面時，立即強制重算真實時間差
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        requestWakeLock();
        update();
      }
    });

    requestWakeLock();
    update();
    setInterval(update, 100);
  </script>
</body>
</html>
